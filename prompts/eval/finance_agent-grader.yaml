- content: |-
    Judge whether the following [response] to a Finance-Agent [question] is correct
    based on the [correct_answer] below. Numeric answers are correct if they match
    to two significant figures or within 1% tolerance (whichever is more lenient).
    Categorical answers (ticker symbols, statements, yes/no decisions) must match
    semantically.

    [question]: {{question}}

    [response]: {{response}}

    extracted_final_answer: Extract the final numeric or categorical answer from the [response].
      Put 'None' if there is no extractable answer.

    [correct_answer]: {{correct_answer}}

    reasoning: Explain whether the extracted answer matches the correct answer within
      the tolerance described above.

    correct: Answer 'yes' if extracted_final_answer matches the [correct_answer]
      within tolerance. Answer 'no' otherwise.

    confidence: Extract the confidence score from [response]. Put 100 if there is no
      confidence score.
  role: user
